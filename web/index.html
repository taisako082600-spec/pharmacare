<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ファーマケア - 介護施設のスタッフと薬剤師をつなぐ服薬管理アプリ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ファーマケア">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ファーマケア</title>
  <link rel="manifest" href="manifest.json">
  <script src="jsqr.min.js"></script>
  <script src="qr-scanner.legacy.min.js"></script>
  <!--
    ここには以前、QRスキャナのヘルパー(startLiveQRScanner / startQRScanner /
    decodeQRFromInput 等)を定義したインラインスクリプトがあったが、2026-08-19に削除した。

    理由: 途中の /* が閉じられておらず、スクリプト全体が構文エラーで実行されていなかった。
    そのためヘルパーは5つとも undefined で、読み込みのたびにコンソールへ
    SyntaxError を出していた(本番で確認)。

    実害が無かったのは、実際のスキャナが lib/screens/qr_scanner_screen.dart 側で
    eval により自前で組み立てられており、ここのヘルパーを一切呼んでいなかったため。
    19KBの死んだコードと、本物のエラーを埋もれさせるノイズだけが残っていたので消した。

    上の jsqr.min.js と qr-scanner.legacy.min.js は、その eval 側が jsQR / QrScanner として
    参照しているので必要。消してはいけない。
  -->
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // サービスワーカーを完全無効化 - 常にサーバーから最新版を取得
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      // 新規登録もブロック
      navigator.serviceWorker.register = function() {
        return Promise.resolve();
      };
    }
  </script>
  <script>
    // 添付文書PDFからテキストを抜き出すヘルパー(管理画面の手動登録用)。
    //
    // PDFはサーバーへ送らない。抽出はこのブラウザの中だけで完結し、
    // 外へ出るのは抜き出したテキストだけにしてある。
    //
    // pdf.js は本体とワーカーで合わせて約1.7MBある。管理者が手動登録を開いた
    // ときにしか要らないので、<script>で常時読み込まず、初回呼び出し時に
    // 動的importで取りに行く。施設の共用端末は非力なので、全利用者の
    // 読み込み時間をこれで延ばしたくない。
    (function () {
      var pdfjsPromise = null;

      function loadPdfJs() {
        if (!pdfjsPromise) {
          pdfjsPromise = import('./pdf.min.mjs').then(function (lib) {
            lib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';
            return lib;
          });
        }
        return pdfjsPromise;
      }

      // ファイル選択から抽出までをまとめて行う。
      // 戻り値は { fileName, text }、選択がキャンセルされた場合は null。
      // file_picker パッケージを足さずに済ませている(依存を増やさない方針)。
      window.pickAndExtractPdfText = function () {
        return new Promise(function (resolve, reject) {
          var input = document.createElement('input');
          input.type = 'file';
          input.accept = 'application/pdf,.pdf';
          input.style.display = 'none';
          document.body.appendChild(input);

          function cleanup() {
            if (input.parentNode) input.parentNode.removeChild(input);
          }

          input.addEventListener('change', function () {
            var file = input.files && input.files[0];
            if (!file) {
              cleanup();
              resolve(null);
              return;
            }
            file
              .arrayBuffer()
              .then(function (buf) {
                return window.extractPdfText(new Uint8Array(buf));
              })
              .then(function (text) {
                cleanup();
                resolve({ fileName: file.name, text: text });
              })
              .catch(function (e) {
                cleanup();
                reject(e);
              });
          });

          // 選択せずに閉じた場合はchangeが飛ばないので、フォーカスが戻ったら諦める。
          // これが無いと、キャンセルした利用者の画面が読み込み中のまま止まる。
          window.addEventListener(
            'focus',
            function () {
              setTimeout(function () {
                if (input.parentNode && !(input.files && input.files.length)) {
                  cleanup();
                  resolve(null);
                }
              }, 500);
            },
            { once: true }
          );

          input.click();
        });
      };

      // bytes: Uint8Array。戻り値はページ順に連結したプレーンテキスト。
      //
      // 章の分割はここではやらない。サーバー側の ChunkAttachmentDocument に
      // 任せることで、自動取得と手動登録で分割ロジックが分かれないようにしている。
      window.extractPdfText = function (bytes) {
        return loadPdfJs().then(function (pdfjs) {
          return pdfjs.getDocument({ data: bytes }).promise.then(function (doc) {
            var pages = [];
            for (var i = 1; i <= doc.numPages; i++) pages.push(i);
            return Promise.all(
              pages.map(function (n) {
                return doc.getPage(n).then(function (page) {
                  return page.getTextContent().then(function (content) {
                    // 添付文書は章見出しが独立行になっている前提で分割するため、
                    // 行の区切りを保つ必要がある。pdf.jsのitemには行末で
                    // hasEOL が立つので、それを改行に戻す。
                    // 単純に空白連結すると見出しが本文に埋もれ、章が1つも取れない。
                    var out = '';
                    content.items.forEach(function (item) {
                      if (typeof item.str !== 'string') return;
                      out += item.str;
                      if (item.hasEOL) out += '\n';
                    });
                    return out;
                  });
                });
              })
            ).then(function (texts) {
              return texts.join('\n');
            });
          });
        });
      };
    })();
  </script>
  <script>
    // 見読性(書面作成)のためのヘルパー。
    //
    // 「医療情報を取り扱う情報システム・サービスの提供事業者における安全管理
    // ガイドライン第2.0版」6.2 が求める見読性は、画面表示だけでなく
    // 「直ちに明瞭かつ整然とした形式で……表示し、及び書面を作成できるようにすること」
    // を要件としている。Flutter Web は canvas 描画のためブラウザの印刷が使えないので、
    // 記録内容を別ウィンドウにHTMLとして書き出して印刷ダイアログを開く。
    //
    // HTMLは呼び出し側(Dart)でエスケープ済みの文字列を組み立てて渡す。
    window.printMedicalRecord = function (html) {
      var w = window.open('', '_blank');
      if (!w) {
        alert('ポップアップがブロックされました。ブラウザの設定で許可してください。');
        return false;
      }
      w.document.open();
      w.document.write(html);
      w.document.close();
      // 描画完了を待ってから印刷ダイアログを開く
      w.onload = function () {
        w.focus();
        w.print();
      };
      return true;
    };
  </script>
  <script src="flutter_bootstrap.js?v=DEPLOY_TIMESTAMP" async></script>
</body>
</html>
