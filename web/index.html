<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ファーマケア - 介護施設のスタッフと薬剤師をつなぐ服薬管理アプリ">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ファーマケア">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ファーマケア</title>
  <link rel="manifest" href="manifest.json">
  <script src="jsqr.min.js"></script>
  <script src="qr-scanner.legacy.min.js"></script>
  <!--
    ここには以前、QRスキャナのヘルパー(startLiveQRScanner / startQRScanner /
    decodeQRFromInput 等)を定義したインラインスクリプトがあったが、2026-08-19に削除した。

    理由: 途中の /* が閉じられておらず、スクリプト全体が構文エラーで実行されていなかった。
    そのためヘルパーは5つとも undefined で、読み込みのたびにコンソールへ
    SyntaxError を出していた(本番で確認)。

    実害が無かったのは、実際のスキャナが lib/screens/qr_scanner_screen.dart 側で
    eval により自前で組み立てられており、ここのヘルパーを一切呼んでいなかったため。
    19KBの死んだコードと、本物のエラーを埋もれさせるノイズだけが残っていたので消した。

    上の jsqr.min.js と qr-scanner.legacy.min.js は、その eval 側が jsQR / QrScanner として
    参照しているので必要。消してはいけない。
  -->
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // サービスワーカーを完全無効化 - 常にサーバーから最新版を取得
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      // 新規登録もブロック
      navigator.serviceWorker.register = function() {
        return Promise.resolve();
      };
    }
  </script>
  <script>
    // 見読性(書面作成)のためのヘルパー。
    //
    // 「医療情報を取り扱う情報システム・サービスの提供事業者における安全管理
    // ガイドライン第2.0版」6.2 が求める見読性は、画面表示だけでなく
    // 「直ちに明瞭かつ整然とした形式で……表示し、及び書面を作成できるようにすること」
    // を要件としている。Flutter Web は canvas 描画のためブラウザの印刷が使えないので、
    // 記録内容を別ウィンドウにHTMLとして書き出して印刷ダイアログを開く。
    //
    // HTMLは呼び出し側(Dart)でエスケープ済みの文字列を組み立てて渡す。
    window.printMedicalRecord = function (html) {
      var w = window.open('', '_blank');
      if (!w) {
        alert('ポップアップがブロックされました。ブラウザの設定で許可してください。');
        return false;
      }
      w.document.open();
      w.document.write(html);
      w.document.close();
      // 描画完了を待ってから印刷ダイアログを開く
      w.onload = function () {
        w.focus();
        w.print();
      };
      return true;
    };
  </script>
  <script src="flutter_bootstrap.js?v=DEPLOY_TIMESTAMP" async></script>
</body>
</html>
